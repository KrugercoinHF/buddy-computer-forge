[project]
name = "buddy-computer-forge"
version = "0.8.0"
description = "Buddy Computer Forge local control plane with node telemetry, mission planning, approvals, and bounded worker execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "psutil>=6.0.0",
  "requests>=2.32.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["buddy", "worker"]
