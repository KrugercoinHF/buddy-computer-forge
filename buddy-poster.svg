<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title desc"><title id="title">Buddy AI Boardroom — governed multi-agent architecture</title><desc id="desc">Operator-led boardroom with specialist agents, project memory, build factory, experiment system and security controls.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142849"/></linearGradient><linearGradient id="blue" x2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="3200" height="1800" fill="url(#bg)"/><text x="160" y="170" fill="#38bdf8" font-family="Arial" font-size="42" letter-spacing="16">BUDDY INNOVATION ENVIRONMENT</text><text x="160" y="285" fill="#e5e7eb" font-family="Arial" font-size="104" font-weight="700">AI BOARDROOM</text><text x="165" y="360" fill="#9ca3af" font-family="Arial" font-size="42">A governed multi-agent command and decision system</text><rect x="1260" y="455" width="680" height="220" rx="34" fill="url(#blue)" stroke="#60a5fa" stroke-width="5"/><text x="1600" y="545" text-anchor="middle" fill="#fff" font-family="Arial" font-size="54" font-weight="700">USER / OPERATOR</text><text x="1600" y="610" text-anchor="middle" fill="#dbeafe" font-family="Arial" font-size="30">Objective · constraints · approval</text><path d="M1600 675V775" stroke="#f59e0b" stroke-width="9"/><rect x="920" y="790" width="1360" height="260" rx="34" fill="#111c2e" stroke="#38bdf8" stroke-width="5"/><text x="1600" y="890" text-anchor="middle" fill="#e5e7eb" font-family="Arial" font-size="64" font-weight="700">BOARDROOM ORCHESTRATOR</text><text x="1600" y="970" text-anchor="middle" fill="#9ca3af" font-family="Arial" font-size="34">Plan · delegate · deliberate · synthesize · request approval</text><g font-family="Arial" text-anchor="middle"><rect x="170" y="1170" width="850" height="250" rx="28" fill="#111c2e" stroke="#f59e0b" stroke-width="4"/><text x="595" y="1270" fill="#f59e0b" font-size="54">PROJECT MEMORY</text><text x="595" y="1340" fill="#e5e7eb" font-size="30">Versioned context · decisions · evidence</text><rect x="1175" y="1170" width="850" height="250" rx="28" fill="#111c2e" stroke="#10b981" stroke-width="4"/><text x="1600" y="1270" fill="#10b981" font-size="54">BUILD FACTORY</text><text x="1600" y="1340" fill="#e5e7eb" font-size="30">Proposed specs · sandboxed build · review</text><rect x="2180" y="1170" width="850" height="250" rx="28" fill="#111c2e" stroke="#38bdf8" stroke-width="4"/><text x="2605" y="1270" fill="#38bdf8" font-size="54">EXPERIMENT SYSTEM</text><text x="2605" y="1340" fill="#e5e7eb" font-size="30">Test · observe · measure · learn</text></g><path d="M1600 1050V1110H595V1170M1600 1110V1170M1600 1110H2605V1170" fill="none" stroke="#64748b" stroke-width="7"/><rect x="160" y="1510" width="2880" height="150" rx="26" fill="#082f49" stroke="#38bdf8" stroke-width="4"/><text x="1600" y="1605" text-anchor="middle" fill="#bae6fd" font-family="Arial" font-size="48" font-weight="700">SECURITY · AUTHENTICATION · LEAST PRIVILEGE · AUDIT · OWNER APPROVAL</text><text x="160" y="1730" fill="#9ca3af" font-family="Arial" font-size="26">V1 SIMULATOR · provider calls, autonomous execution and deployment are not enabled</text></svg>
