name: Programmer skill and Dev config
on:
  pull_request:
    paths:
      - "skills/computer-software-programmer/**"
      - "skills/registry.json"
      - "wings/dev.json"
      - "pm/artifacts.json"
      - "scripts/validate-dev-config.js"
      - "tests/*.test.js"
      - ".github/workflows/skill-tools.yml"
  push:
    branches: [main]
    paths:
      - "skills/computer-software-programmer/**"
      - "skills/registry.json"
      - "wings/dev.json"
      - "pm/artifacts.json"
      - "scripts/validate-dev-config.js"
      - "tests/*.test.js"
      - ".github/workflows/skill-tools.yml"
jobs:
  node-tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/*.test.js
      - run: node scripts/validate-dev-config.js
