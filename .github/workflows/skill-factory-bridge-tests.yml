name: Skill Factory bridge unit tests

on:
  pull_request:
    branches:
      - buddy-agency-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-factory-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge-unit-tests:
    name: Bridge unit tests (no secrets, read-only token)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "false"
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check "pytest==8.3.5"
      - name: Run bridge unit tests
        run: python -m pytest -q tests/test_skill_factory_bridge.py
